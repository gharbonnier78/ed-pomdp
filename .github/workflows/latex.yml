name: build-documents
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed close-out PDF manifest
        run: sha256sum -c paper/step2_closeout.sha256

      - name: Preserve committed close-out PDF
        run: cp paper/step2_closeout.pdf /tmp/step2_closeout.committed.pdf

      - name: Compile active LaTeX corpus
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            paper/main.tex
            paper/step2_closeout.tex
            paper/milestone2r_theory_claim_reset.tex
            research_program/research_program.tex
            survey/related_work.tex
            reviewer/reviewer_companion.tex
            reviewer/guide_fr_milestone2r.tex
            ontology/evidence_ontology.tex
            appendix/mathematical_appendix.tex
            benchmark/results/STEP_2_7_EXECUTIVE_STATUS_NOTE.tex
          work_in_root_file_dir: true

      - name: Preserve first deterministic close-out build
        run: cp paper/step2_closeout.pdf /tmp/step2_closeout.first.pdf

      - name: Remove close-out build products
        run: |
          rm -f paper/step2_closeout.pdf \
                paper/step2_closeout.aux \
                paper/step2_closeout.fdb_latexmk \
                paper/step2_closeout.fls \
                paper/step2_closeout.log \
                paper/step2_closeout.out \
                paper/step2_closeout.toc \
                paper/step2_closeout.synctex.gz

      - name: Rebuild close-out from a clean state
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/step2_closeout.tex
          work_in_root_file_dir: true

      - name: Verify bit-for-bit close-out reproducibility
        run: |
          cmp /tmp/step2_closeout.first.pdf paper/step2_closeout.pdf
          cmp /tmp/step2_closeout.committed.pdf paper/step2_closeout.pdf
          sha256sum -c paper/step2_closeout.sha256

      - name: Verify package and current scientific status
        run: |
          python3 scripts/check_current_status.py
          python3 scripts/check_package.py

      - name: Publish v1.4 document bundle
        uses: actions/upload-artifact@v4
        with:
          name: ed-pomdp-v1.4-documents
          if-no-files-found: error
          path: |
            paper/main.pdf
            paper/step2_closeout.pdf
            paper/milestone2r_theory_claim_reset.pdf
            research_program/research_program.pdf
            reviewer/reviewer_companion.pdf
            reviewer/guide_fr_milestone2r.pdf
            survey/related_work.pdf
            ontology/evidence_ontology.pdf
            appendix/mathematical_appendix.pdf
            benchmark/results/STEP_2_7_EXECUTIVE_STATUS_NOTE.pdf

  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q benchmark/tests

  publish-carousel-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/carousel-linkedin-publication-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install publication verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check pypdf pillow

      - name: Verify uploaded A4 publication PDF
        env:
          EXPECTED_PDF_SHA256: 94f2fd2f1d1c8ff17709c359a7cb833e30ecc6eef5c90151c4bba64f31f431a3
        run: |
          set -euo pipefail
          TARGET="publications/linkedin/ed-pomdp-carousel-v1.0"
          UPLOAD="$TARGET/_upload/ed_pomdp_carousel_linkedin_v1.0.pdf"
          test -f "$UPLOAD"
          printf '%s  %s\n' "$EXPECTED_PDF_SHA256" "$UPLOAD" | sha256sum -c -

      - name: Publish PDF and render the 19 page images
        run: |
          set -euo pipefail
          TARGET="publications/linkedin/ed-pomdp-carousel-v1.0"
          UPLOAD="$TARGET/_upload/ed_pomdp_carousel_linkedin_v1.0.pdf"
          PDF="$TARGET/ed_pomdp_carousel_linkedin_v1.0.pdf"
          rm -rf "$TARGET/images"
          mkdir -p "$TARGET/images"
          cp "$UPLOAD" "$PDF"
          pdftoppm -jpeg -r 96 "$PDF" "$TARGET/images/page" >/dev/null

      - name: Freeze checksums and validate page geometry
        run: |
          set -euo pipefail
          TARGET="publications/linkedin/ed-pomdp-carousel-v1.0"
          cd "$TARGET"
          {
            sha256sum ed_pomdp_carousel_linkedin_v1.0.pdf
            find images -maxdepth 1 -type f -name 'page-*.jpg' -print0 | sort -z | xargs -0 sha256sum
          } > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(find images -maxdepth 1 -type f -name 'page-*.jpg' | wc -l)" = "19"
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from PIL import Image

          pdf = Path('ed_pomdp_carousel_linkedin_v1.0.pdf')
          reader = PdfReader(str(pdf))
          assert len(reader.pages) == 19, len(reader.pages)
          for index, page in enumerate(reader.pages, start=1):
              width = float(page.mediabox.width)
              height = float(page.mediabox.height)
              assert abs(width - 1055.0) < 0.01, (index, width)
              assert abs(height - 1491.0) < 0.01, (index, height)
          images = sorted(Path('images').glob('page-*.jpg'))
          assert len(images) == 19, len(images)
          for image_path in images:
              with Image.open(image_path) as image:
                  assert image.size == (1407, 1988), (image_path, image.size)
          PY
          test "$(pdfinfo ed_pomdp_carousel_linkedin_v1.0.pdf | awk '/^Pages:/ {print $2}')" = "19"

      - name: Remove staging and restore standard CI
        run: |
          set -euo pipefail
          rm -rf publications/linkedin/ed-pomdp-carousel-v1.0/_upload
          rm -f .github/workflows/expand-linkedin-carousel-package.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/latex.yml

      - name: Commit verified publication assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A publications/linkedin/ed-pomdp-carousel-v1.0 .github/workflows/latex.yml .github/workflows/expand-linkedin-carousel-package.yml
          git commit -m "Add verified LinkedIn carousel publication assets"
          git push origin HEAD:carousel-linkedin-publication-v1
