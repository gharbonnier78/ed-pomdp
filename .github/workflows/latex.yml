name: build-documents
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            paper/main.tex
            research_program/research_program.tex
            survey/related_work.tex
            reviewer/reviewer_companion.tex
            ontology/evidence_ontology.tex
            appendix/mathematical_appendix.tex
            benchmark/results/STEP_2_7_NOTE_ETAT_EXECUTIVE_FR.tex
          work_in_root_file_dir: true
      - run: python3 scripts/check_package.py

  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q benchmark/tests
