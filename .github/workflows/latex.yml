name: build-documents
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            paper/main.tex
            research_program/research_program.tex
            survey/related_work.tex
            reviewer/reviewer_companion.tex
            ontology/evidence_ontology.tex
            appendix/mathematical_appendix.tex
          work_in_root_file_dir: true
      - run: python3 scripts/check_package.py

  test-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q benchmark/tests

  generate-freeze-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Generate next freeze artifact
        id: freeze
        shell: bash
        run: |
          if [ -f benchmark/protocol/ANALYSIS_FREEZE.json ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
          elif [ -f benchmark/config/FROZEN_ARTIFACTS.json ]; then
            python scripts/freeze_headline_analysis.py manifest
            echo "kind=manifest" >> "$GITHUB_OUTPUT"
          else
            python scripts/freeze_headline_analysis.py lock
            echo "kind=lock" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.freeze.outputs.kind != 'none'
        with:
          name: step2-freeze-${{ steps.freeze.outputs.kind }}
          path: |
            benchmark/config/FROZEN_ARTIFACTS.json
            benchmark/protocol/ANALYSIS_FREEZE.json
          if-no-files-found: error
