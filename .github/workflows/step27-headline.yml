name: step-2.7-headline-execution

on:
  push:
    branches:
      - step-2.7-headline-execution
    paths:
      - .github/workflows/step27-headline.yml

jobs:
  execute-and-analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step-2.7-headline-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Verify frozen test suite
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q benchmark/tests
      - name: Execute frozen headline matrix
        run: python -m benchmark.experiment.run_headline
      - name: Run frozen confirmatory analysis
        run: python -m benchmark.analysis.analyze_headline
      - name: Verify result artifacts
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path("benchmark/results")
          expected = {
              "headline_raw.csv": 3360,
              "headline_summary.csv": 448,
              "headline_contrasts.csv": 240,
          }
          audit = {"files": {}}
          for name, expected_rows in expected.items():
              path = root / name
              with path.open(newline="", encoding="utf-8") as handle:
                  rows = sum(1 for _ in csv.DictReader(handle))
              if rows != expected_rows:
                  raise SystemExit(f"{name}: {rows} rows; expected {expected_rows}")
              audit["files"][name] = {
                  "rows": rows,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          metadata = json.loads((root / "headline_run_metadata.json").read_text())
          if metadata["row_count"] != 3360:
              raise SystemExit("run metadata row count mismatch")
          audit["run_metadata"] = metadata
          (root / "step27_execution_audit.json").write_text(
              json.dumps(audit, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(audit, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: step2.7-headline-results
          path: benchmark/results/
          if-no-files-found: error
          retention-days: 90
