name: step-2.8-closeout-pdf

on:
  push:
    branches:
      - step-2.8-claim-adjudication
    paths:
      - .github/workflows/step28-closeout-pdf.yml
      - paper/step2_closeout.tex
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/step28-closeout-pdf.yml
      - paper/step2_closeout.tex

permissions:
  contents: write

jobs:
  compile-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step-2.8-claim-adjudication
          fetch-depth: 0

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/step2_closeout.tex
          work_in_root_file_dir: true

      - name: Verify PDF
        run: |
          test -s paper/step2_closeout.pdf
          test "$(stat -c%s paper/step2_closeout.pdf)" -gt 5000
          sha256sum paper/step2_closeout.pdf

      - name: Commit exact PDF to the Step 2.8 branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/step2_closeout.pdf
          if git diff --cached --quiet; then
            echo "No PDF change to commit"
          else
            git commit -m "Step 2.8: record visually verified close-out PDF"
            git push origin HEAD:step-2.8-claim-adjudication
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: step2.8-closeout-pdf
          path: paper/step2_closeout.pdf
          retention-days: 90
