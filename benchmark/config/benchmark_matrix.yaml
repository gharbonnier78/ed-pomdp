schema_version: 0.2.0
benchmark: ed-pomdp-step2
status: superseded_by_executable_headline_matrix
canonical_executable_matrix: benchmark/config/headline_matrix.json
note: >-
  The earlier multi-axis lists were research-family scaffolding rather than an
  executable full factorial. Step 2.6 freezes the four implemented regimes,
  four budgets, thirty common seeds, seven policies, explicit LossWeights,
  exact-cost horizon and statistical settings in headline_matrix.json.
claims_under_test:
  - CLM-VOI-001
  - CLM-EQ-001
headline_dimensions:
  regimes:
    - identifiable
    - evidence_degraded
    - likelihood_misspecified
    - non_identifiable
  budgets: [2, 4, 8, 12]
  seeds: 30
  policies:
    - ed_pomdp_voi
    - classical_pomdp
    - entropy_acquisition
    - fixed_plan
    - random_acquisition
    - risk_only
    - rule_based
matched_budget:
  mode: fixed_horizon_exact_cost
  allow_early_stopping: false
  enforce_equal_total_cost: true
  enforce_equal_channel_access: true
  enforce_equal_horizon: true
  prohibit_ground_truth_access: true
