  - classical_pomdp
  - entropy_acquisition
  - fixed_plan
  - random_acquisition
  - risk_only
  - rule_based
primary_metrics:
  - decision_loss
  - unsafe_go_rate
  - brier_score
  - expected_calibration_error
secondary_metrics:
